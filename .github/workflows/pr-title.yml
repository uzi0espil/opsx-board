name: PR title

# The squash commit on main takes the pull request title, and the release notes sort the commits
# by its Conventional Commit type.
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions: {}

jobs:
  pr-title:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check the title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          re='^(feat|fix|perf|refactor|docs|test|build|ci|chore|revert|style)(\([A-Za-z0-9._/-]+\))?!?: [^[:space:]]'
          if [[ ! $TITLE =~ $re ]]; then
            echo "::error::The title is not a Conventional Commit header, such as \"feat: add a Jira provider\" or \"fix(apply)!: keep the run after an interrupt\". See CONTRIBUTING.md."
            exit 1
          fi
