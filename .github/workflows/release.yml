name: Release

# Run it on main, from the Actions tab or with `gh workflow run release.yml`, once the pull
# request that raises the version in .claude-plugin/plugin.json is merged.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DISABLE_AUTOUPDATER: '1'
      CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: '1'
    steps:
      - name: Require main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Run the release on main."
          exit 1
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - name: Check the version and write the notes
        id: plan
        run: node .github/scripts/release.mjs "$RUNNER_TEMP/notes.md"
      - name: Install Claude Code
        run: npm install --global @anthropic-ai/claude-code
      - name: Validate
        run: claude plugin validate --strict .
      - name: Test
        run: claude plugin test .
      - name: Tag
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          claude plugin tag --push .
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.plan.outputs.tag }}
          VERSION: ${{ steps.plan.outputs.version }}
        run: |
          gh release create "$TAG" --verify-tag --title "opsx-board $VERSION" --notes-file "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md" >> "$GITHUB_STEP_SUMMARY"
